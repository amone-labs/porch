<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2360, height=1280">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* porch landing "works" clip: sessions started in three different terminals land in one porch list.
         Generated by site/video/build-works.mjs from works.template.html and works.css; edit those, not this file.
         The terminal windows and the menu bar are drawn here; the session list is the real app (pnpm shoot).
         Laid out at 1180×640 and drawn at 2×. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 2360px; height: 1280px; overflow: hidden; background: #0a0a0c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; }
      #stage { transform: scale(2); }
/* The "works" scene: three terminal windows, porch's menu-bar icon and the real session list. Shared by the
   standalone clip (works.template.html) and the hero's session scene (hero.template.html), so every class is
   wk- prefixed. `.wk` is the 1180×640 stage; the page scales it. Palette: near-black, achromatic. */
.wk { position: absolute; left: 0; top: 0; width: 1180px; height: 640px; transform-origin: 0 0;
  font-family: -apple-system, system-ui, sans-serif; color: #d8d8de; }

/* macOS menu bar: porch's tray icon and, once a session waits, its count (the app sets it as the tray title) */
.wk-menubar { position: absolute; z-index: 5; left: 0; top: 0; width: 1180px; height: 26px; background: rgba(255,255,255,0.045);
  border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 16px;
  font-size: 13px; color: #d0d0d6; font-variant-numeric: tabular-nums; }
.wk-tray { position: relative; display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 5px; }
.wk .wk-tray img { display: block; width: 18px; height: 18px; filter: invert(1); opacity: 0.92; }
.wk-count { display: inline-block; min-width: 8px; font-weight: 500; color: #f2f2f5; opacity: 0; }
.wk-ring { position: absolute; inset: -3px; border-radius: 7px; border: 1.5px solid rgba(237,237,240,0.9);
  box-shadow: 0 0 0 4px rgba(237,237,240,0.08); opacity: 0; }

/* terminal windows: each app keeps its own shape, and its name sits in the title bar */
.wk-term { position: absolute; top: 46px; width: 352px; border-radius: 11px; background: #121215; border: 1px solid #27272d; overflow: hidden; }
.wk-glow { position: absolute; inset: -1px; border-radius: 11px; border: 1.5px solid rgba(237,237,240,0.85);
  box-shadow: 0 0 0 4px rgba(237,237,240,0.07); opacity: 0; pointer-events: none; z-index: 3; }
.wk-bar { height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 11px; background: #18181c; border-bottom: 1px solid #222227;
  font-size: 12px; color: #8e8e98; }
.wk-bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3a42; flex: 0 0 auto; }
.wk-app { margin-left: 8px; color: #d6d6dc; font-weight: 600; }
.wk-title { margin-left: auto; color: #6e6e78; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
.wk-tabs { height: 24px; display: flex; align-items: flex-end; padding: 0 8px; background: #141417; border-bottom: 1px solid #222227; }
.wk-tabs span { position: relative; font-size: 11px; color: #c9c9d1; padding: 4px 14px; background: #1d1d22; border: 1px solid #2a2a31; border-bottom: 0; border-radius: 6px 6px 0 0; }
.wk-tabs span b { font-weight: 400; }
.wk-tabs span b + b { position: absolute; left: 14px; top: 4px; opacity: 0; }
.wk-code { position: absolute; left: 0; right: 0; }
.wk pre { margin: 0; font: 12px/1.65 ui-monospace, "SF Mono", Menlo, monospace; padding: 9px 12px; color: #c9c9d1; white-space: pre; }
.wk-dim { color: #6e6e78; }
.wk-typed { display: inline-block; overflow: hidden; vertical-align: bottom; white-space: pre; width: 0; color: #f2f2f5; }
.wk-cursor, .wk-cursor2 { display: inline-block; width: 7px; height: 14px; vertical-align: -2px; background: #d8d8de; }
.wk-cursor2 { opacity: 0; }
/* VS Code: activity bar on the left, an editor above, the TERMINAL panel below */
.wk-vs-act { position: absolute; left: 0; top: 28px; bottom: 0; width: 30px; background: #151518; border-right: 1px solid #222227;
  display: flex; flex-direction: column; align-items: center; gap: 9px; padding-top: 9px; }
.wk-vs-act b { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid #4a4a54; }
.wk-vs-act b:first-child { border-color: #9a9aa4; }
.wk-vs-editor { position: absolute; left: 30px; right: 0; top: 28px; height: 36px; padding: 6px 12px; border-bottom: 1px solid #222227; }
.wk-vs-editor s { display: block; height: 5px; margin: 5px 0; border-radius: 3px; background: #26262d; text-decoration: none; }
.wk-vs-panel { position: absolute; left: 30px; right: 0; top: 64px; bottom: 0; }
.wk-vs-head { height: 20px; display: flex; align-items: flex-end; gap: 14px; padding: 0 12px; font-size: 9.5px; letter-spacing: 0.06em; color: #6e6e78; }
.wk-vs-head span:first-child { color: #d6d6dc; border-bottom: 1px solid #d6d6dc; padding-bottom: 2px; }
.wk-vs-panel pre { padding-top: 4px; }

/* the real session list: each project's group as it arrives, inside a frame drawn over them */
.wk-list { position: absolute; z-index: 2; left: 150px; width: 990px; border-radius: 12px; border: 1px solid #26262c; pointer-events: none;
  box-shadow: 0 0 0 8px #0a0a0c; } /* hides the groups' corners outside the frame's curve */
.wk-group { position: absolute; z-index: 1; left: 150px; width: 990px; background-color: #0a0a0c; background-repeat: no-repeat; opacity: 0; will-change: transform; border-radius: 10px; }
.wk-tag { position: absolute; left: 34px; width: 100px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; opacity: 0;
  font-size: 12px; font-weight: 600; color: #d6d6dc; }
.wk-tag::after { content: ""; width: 12px; height: 1px; background: rgba(237,237,240,0.5); }
.wk-focus { position: absolute; z-index: 3; border-radius: 9px; border: 1.5px solid rgba(237,237,240,0.92);
  box-shadow: 0 0 0 4px rgba(237,237,240,0.08), 0 0 0 2000px rgba(5,5,7,0.36); opacity: 0; pointer-events: none; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="works" data-start="0" data-duration="8" data-width="2360" data-height="1280">
      <div id="stage" class="wk clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="wk-menubar"><span class="wk-tray"><img src="assets/tray.png" alt=""><span class="wk-count" id="count">1</span><span class="wk-ring" id="ring"></span></span><span>17:40</span></div>
        <div class="wk-term" style="left:40px;height:160px"><div class="wk-bar"><i></i><i></i><i></i><span class="wk-app">Ghostty</span><span class="wk-title">~/work/shop-web</span></div><div class="wk-code" style="top:28px"><pre><span class="wk-dim">~/work/shop-web</span>
❯ <span class="wk-typed" id="t0">claude</span><span class="wk-cursor" id="k0"></span>
<span class="wk-cursor2" id="n0"></span></pre></div><div class="wk-glow" id="g0"></div></div>
        <div class="wk-term" style="left:414px;height:160px"><div class="wk-bar"><i></i><i></i><i></i><span class="wk-app">iTerm2</span></div><div class="wk-tabs"><span><b id="tz1">zsh</b><b id="tab1">codex</b></span></div><div class="wk-code" style="top:52px"><pre><span class="wk-dim">~/work/shop-api</span>
❯ <span class="wk-typed" id="t1">codex</span><span class="wk-cursor" id="k1"></span>
<span class="wk-cursor2" id="n1"></span></pre></div><div class="wk-glow" id="g1"></div></div>
        <div class="wk-term" style="left:788px;height:160px"><div class="wk-bar"><i></i><i></i><i></i><span class="wk-app">VS Code</span><span class="wk-title">porch-site</span></div><div class="wk-vs-act"><b></b><b></b><b></b><b></b></div><div class="wk-vs-editor"><s style="width:62%"></s><s style="width:44%"></s><s style="width:70%"></s></div>
          <div class="wk-vs-panel"><div class="wk-vs-head"><span>TERMINAL</span><span>PROBLEMS</span><span>OUTPUT</span></div><pre><span class="wk-dim">~/work/porch-site</span>
❯ <span class="wk-typed" id="t2">claude</span><span class="wk-cursor" id="k2"></span>
<span class="wk-cursor2" id="n2"></span></pre></div><div class="wk-glow" id="g2"></div></div>
        <div class="wk-group" id="s0" style="top:236.0px;height:124.3px;background-image:url(assets/app-now.png);background-size:1286.6px auto;background-position:-261.7px -195.2px"></div>
        <div class="wk-tag" id="a0" style="top:245.5px;height:18px">Ghostty</div>
        <div class="wk-group" id="s1" style="top:360.3px;height:124.3px;background-image:url(assets/app-now.png);background-size:1286.6px auto;background-position:-261.7px -319.5px"></div>
        <div class="wk-tag" id="a1" style="top:369.8px;height:18px">iTerm2</div>
        <div class="wk-group" id="s2" style="top:484.6px;height:105.8px;background-image:url(assets/app-now.png);background-size:1286.6px auto;background-position:-261.7px -443.8px"></div>
        <div class="wk-tag" id="a2" style="top:494.1px;height:18px">VS Code</div>
        <div class="wk-list" style="top:236px;height:354.4px"></div>
        <div class="wk-focus" id="focus" style="left:150.0px;top:265.4px;width:990.0px;height:77.4px"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      // Ghostty: type `claude`, start it, and its session lands in porch's list
      tl.to("#t0", { width: "6ch", duration: 0.45, ease: "steps(6)" }, 0.35);
      tl.set("#k0", { opacity: 0 }, 0.95); tl.set("#n0", { opacity: 1 }, 0.95);
      tl.fromTo("#g0", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.95); tl.to("#g0", { opacity: 0, duration: 0.4 }, 1.85);
      tl.fromTo("#s0", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1);
      tl.fromTo("#s0", { x: -429.0, y: -152.9, scale: 0.3, boxShadow: "0 18px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(237,237,240,0.35)" }, { x: 0, y: 0, scale: 1, boxShadow: "0 0px 0px rgba(0,0,0,0), 0 0 0 0px rgba(237,237,240,0)", duration: 0.8, ease: "power3.inOut" }, 1);
      tl.fromTo("#a0", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.35 }, 1.7);
      // iTerm2: type `codex`, start it, and its session lands in porch's list
      tl.to("#t1", { width: "5ch", duration: 0.45, ease: "steps(5)" }, 1.65);
      tl.set("#k1", { opacity: 0 }, 2.25); tl.set("#n1", { opacity: 1 }, 2.25);
      tl.set("#tab1", { opacity: 1 }, 2.25); tl.set("#tz1", { opacity: 0 }, 2.25);
      tl.fromTo("#g1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.25); tl.to("#g1", { opacity: 0, duration: 0.4 }, 3.15);
      tl.fromTo("#s1", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.3);
      tl.fromTo("#s1", { x: -55.0, y: -277.2, scale: 0.3, boxShadow: "0 18px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(237,237,240,0.35)" }, { x: 0, y: 0, scale: 1, boxShadow: "0 0px 0px rgba(0,0,0,0), 0 0 0 0px rgba(237,237,240,0)", duration: 0.8, ease: "power3.inOut" }, 2.3);
      tl.fromTo("#a1", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.35 }, 3);
      // VS Code: type `claude`, start it, and its session lands in porch's list
      tl.to("#t2", { width: "6ch", duration: 0.45, ease: "steps(6)" }, 2.95);
      tl.set("#k2", { opacity: 0 }, 3.55); tl.set("#n2", { opacity: 1 }, 3.55);
      tl.fromTo("#g2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.55); tl.to("#g2", { opacity: 0, duration: 0.4 }, 4.45);
      tl.fromTo("#s2", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.6);
      tl.fromTo("#s2", { x: 319.0, y: -392.3, scale: 0.3, boxShadow: "0 18px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(237,237,240,0.35)" }, { x: 0, y: 0, scale: 1, boxShadow: "0 0px 0px rgba(0,0,0,0), 0 0 0 0px rgba(237,237,240,0)", duration: 0.8, ease: "power3.inOut" }, 3.6);
      tl.fromTo("#a2", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.35 }, 4.3);
      // the session waiting for permission: boxed, and the menu bar shows the count
      tl.fromTo("#focus", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.4);
      tl.fromTo("#count", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.55);
      tl.fromTo("#ring", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.55);
      tl.to("#ring", { opacity: 0.3, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.9);
      // back to the empty start, so the loop has no jump
      tl.to(["#s0","#a0","#t0","#n0","#s1","#a1","#t1","#n1","#s2","#a2","#t2","#n2","#focus","#count","#ring"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.1);
      tl.set(["#t0","#t1","#t2"], { width: 0, opacity: 1 }, 7.7);
      tl.set(["#k0","#k1","#k2"], { opacity: 1 }, 7.7);
      tl.set("#tab1", { opacity: 0 }, 7.7); tl.set("#tz1", { opacity: 1 }, 7.7);
      tl.set("#stage", { opacity: 1 }, 8);
      window.__timelines = window.__timelines || {};
      window.__timelines["works"] = tl;
      tl.seek(0);
    </script>
  </body>
