<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* porch landing video: a label, a title and one line on top; the real app (demo data, English text
         overlay from site/video/app-capture) large below.
         Generated by site/video/build-hero.mjs from hero.template.html; edit those, not this file. Palette: near-black, achromatic. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a0a0c; font-family: system-ui, sans-serif; color: #e8e8ee; }

      .glow { position: absolute; left: 50%; top: 260px; width: 1900px; height: 1100px; margin-left: -950px;
        background: radial-gradient(closest-side, rgba(255,255,255,0.07), rgba(255,255,255,0) 70%); }

      /* header: three lines, centred, one per scene stacked in place */
      .head { position: absolute; left: 0; right: 0; top: 78px; height: 230px; }
      .copy { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; opacity: 0; }
      .label { font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: 0.22em; text-transform: uppercase; color: #8a8a96; }
      .title { font-size: 72px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; color: #f2f2f5; }
      .sub { max-width: 1180px; font-size: 27px; line-height: 1.35; color: #9a9aa6; text-wrap: balance; }

      /* the app, large, running off the bottom edge */
      .window { position: absolute; left: 50%; top: 340px; width: 1560px; height: 1004px; margin-left: -780px; border-radius: 22px; overflow: hidden;
        background: #0a0a0c; box-shadow: 0 50px 140px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.1); }
      /* macOS window controls over the app's own top edge (hidden title bar): no strip, no divider; colours a little muted */
      .titlebar { position: absolute; left: 16px; top: 15px; z-index: 2; display: flex; gap: 9px; }
      .titlebar i { display: block; width: 14px; height: 14px; border-radius: 50%; }
      .titlebar i:nth-child(1) { background: #e0605a; }
      .titlebar i:nth-child(2) { background: #dcae3f; }
      .titlebar i:nth-child(3) { background: #4fb553; }
      .cam { position: absolute; left: 0; top: 0; width: 1560px; height: 1004px; overflow: hidden; }
      .screen { position: absolute; left: 0; top: 0; width: 1560px; height: 1004px; opacity: 0; }
      /* focus box: a bright outline plus a soft dim over the rest of the screen */
      .focus { position: absolute; border-radius: 12px; border: 2px solid rgba(237,237,240,0.92);
        box-shadow: 0 0 0 6px rgba(237,237,240,0.08), 0 0 0 4000px rgba(5,5,7,0.38); opacity: 0; pointer-events: none; }
      .screen img { display: block; width: 1560px; height: auto; } /* usage is captured taller than the window */
      /* Like the app: the sidebar stays put while the main pane scrolls. The same capture, clipped to the sidebar
         (208 of 1180 px), sits on top of the drifting copy. */
      .screen img.side { position: absolute; left: 0; top: 0; z-index: 1; clip-path: inset(0 82.37% 0 0); }

      /* the session scene: terminals, porch's menu bar and the real list, as in the "works" clip (works.css) */
      .wk-frame { position: absolute; left: 0; top: 0; width: 1560px; height: 1004px; }
{{worksCss}}

      /* Hangul never in mono, and keeps whole words on a line */
      :lang(ko) .label { font-family: system-ui, sans-serif; letter-spacing: 0.08em; }
      :lang(ko) .title { letter-spacing: -0.02em; }
      :lang(ko) .title, :lang(ko) .sub { word-break: keep-all; }

      .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: linear-gradient(rgba(10,10,12,0), #0a0a0c); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{total}}" data-width="1920" data-height="1080">
      <div class="glow clip" id="glow" data-start="0" data-duration="{{total}}" data-track-index="0"></div>

      <div class="window clip" id="window" data-start="0" data-duration="{{total}}" data-track-index="1">
        <div class="cam" id="cam">
{{screens}}
        </div>
      </div>


      <div class="fade clip" id="fade" data-start="0" data-duration="{{total}}" data-track-index="3"></div>

      <div class="head clip" id="head" data-start="0" data-duration="{{total}}" data-track-index="4">
{{copy}}
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });
      const SCENE = {{scene}};

      tl.fromTo("#glow", { scale: 1, opacity: 0.85 }, { scale: 1.06, opacity: 1, duration: SCENE * 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // scene in: header lines rise in one after another; the app screen settles and drifts up
      const enter = (i, at, drift, dur) => {
        tl.fromTo(`#c${i}`, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55 }, at);
        tl.fromTo(`#c${i} .sub`, { opacity: 0 }, { opacity: 1, duration: 0.5 }, at + 0.25);
        tl.fromTo(`#s${i}`, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.inOut" }, at + 0.05);
        // a slow upward drift reads like scrolling and never crops the window's edges; focus boxes ride along
        tl.fromTo(`#s${i} .drift`, { y: 0 }, { y: -drift, duration: dur - 0.6, ease: "power1.inOut" }, at + 0.3);
      };
      const exit = (i, at) => {
        tl.to(`#c${i}`, { opacity: 0, y: -14, duration: 0.4, ease: "power2.in" }, at);
        tl.to(`#s${i}`, { opacity: 0, y: -30, duration: 0.45, ease: "power2.inOut" }, at);
      };
      // the window controls and sidebar never move; only the main pane drifts
      // focus: a box around the element the scene is about
      const focusIn = (id, at) => tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.4 }, at);
      const focusOut = (id, at) => tl.to(id, { opacity: 0, duration: 0.3 }, at);

{{timeline}}

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
